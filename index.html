<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dan's Game Room</title>
  <meta name="description" content="A launcher for Dan's game collection — Mexican Train, Golf, Durak, Par Five, and more to come." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <h1 class="header__title"><span aria-hidden="true">🎮</span> Dan's Game Room</h1>
      <p class="header__subtitle">Pick a game to launch. Each one plays solo against bots or online with a shared room code.</p>
    </header>

    <main id="game-grid" class="grid" aria-label="Games"></main>

    <footer class="footer">
      <p>New games get added here as they're built.</p>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
